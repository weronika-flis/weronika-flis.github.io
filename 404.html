<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · Weronika Flis</title><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#0a0a0b;--text:#ededef;--muted:#8f8f98;--accent:#3fbf9a;--line:#1f1f23}
@media(prefers-color-scheme:light){:root{--bg:#fbf7f1;--text:#1d1b22;--muted:#6b6672;--accent:#0e8f74;--line:#ece4d8}}
*{margin:0;box-sizing:border-box}body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
.code{font:600 clamp(4rem,18vw,8rem)/1 ui-monospace,monospace;letter-spacing:-.04em;color:var(--accent);opacity:.9}
h1{font-size:1.4rem;margin:16px 0 8px;font-weight:600}p{color:var(--muted);max-width:460px;margin:0 auto 26px;line-height:1.6}
a{display:inline-block;padding:10px 22px;border-radius:99px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:500;transition:opacity .2s}
a:hover{opacity:.9}
.ring{width:120px;height:120px;margin:0 auto 10px;border:2px dashed var(--line);border-radius:50%;position:relative;animation:spin 20s linear infinite}
.ring::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);top:-6px;left:50%;margin-left:-5px}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}
</style></head><body><main>
<div class="ring" aria-hidden="true"></div>
<div class="code">404</div>
<h1>Stratum Not Found</h1>
<p>No skeletal remains or cranial landmarks were uncovered at this coordinate. Let's reconstruct your path back to the homepage.</p>
<a href="/">Back to Homepage</a>
</main></body></html>
